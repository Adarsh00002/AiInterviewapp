spring.application.name=MyFirstApp

# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/api/v1.0

# =========================================================
# DATABASE - RENDER POSTGRES
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =========================================================
# APPLICATION BASE URL
# =========================================================

SERVER_BASE_URL=${SERVER_BASE_URL}

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

# =========================================================
# CLOUDINARY
# =========================================================

CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}

# =========================================================
# GROQ
# =========================================================

GROQ_APIKEY=${GROQ_APIKEY}

# =========================================================
# ELEVENLABS
# =========================================================

ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}

# =========================================================
# MULTIPART
# =========================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# =========================================================
# AUDIO
# =========================================================

audio.upload.path=${AUDIO_UPLOAD_PATH}

# =========================================================
# CONVERSATION GROQ
# =========================================================

conversation.groq.model=openai/gpt-oss-20b

# =========================================================
# CONVERSATION STT
# =========================================================

conversation.groq.stt.model=whisper-large-v3-turbo

# =========================================================
# CONVERSATION TTS
# =========================================================

conversation.groq.tts.model=canopylabs/orpheus-v1-english
conversation.groq.tts.voice=troy

# =========================================================
# CONVERSATION AUDIO
# =========================================================

conversation.audio.upload-dir=${CONVERSATION_AUDIO_UPLOAD_DIR}

# =========================================================
# CLERK
# =========================================================

CLERK_ISSUER_URI=${CLERK_ISSUER_URI}
CLERK_SECRET_KEY=${CLERK_SECRET_KEY}